<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Monthly Expense Manager</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6fb;
  color: #222;
}

header {
  background: #4f46e5;
  color: white;
  text-align: center;
  padding: 22px 15px;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

header p {
  margin: 7px 0 0;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

.box {
  background: white;
  padding: 18px;
  margin-bottom: 15px;
  border-radius: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.box h2 {
  margin-top: 0;
  font-size: 19px;
}

/* MONTH */

input,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 16px;
  background: white;
}

/* SUMMARY */

.summary-cards {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin-bottom: 15px;
}

.summary-card {
  background: white;
  border-radius: 14px;
  padding: 15px 8px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.summary-card small {
  display: block;
  color: #777;
  font-size: 12px;
}

.summary-card strong {
  display: block;
  margin-top: 7px;
  font-size: 19px;
}

.income {
  color: #16a34a;
}

.expense {
  color: #dc2626;
}

.balance {
  color: #4f46e5;
}

/* FORM */

label {
  display: block;
  margin-top: 12px;
  margin-bottom: 5px;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 15px;
  border: none;
  border-radius: 9px;
  background: #4f46e5;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

/* CUMULATIVE BAR */

.cumulative-bar {
  width: 100%;
  height: 45px;
  display: flex;
  border-radius: 10px;
  overflow: hidden;
  background: #eee;
  margin: 18px 0 10px;
}

.bar-segment {
  height: 100%;
  min-width: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 11px;
  font-weight: bold;
  overflow: hidden;
  white-space: nowrap;
}

.remaining {
  background: #e5e7eb;
  color: #555;
}

/* LEGEND */

.legend {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 15px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
}

.legend-color {
  width: 14px;
  height: 14px;
  border-radius: 3px;
  flex-shrink: 0;
}

/* CATEGORY LIST */

.category-row {
  margin-bottom: 15px;
}

.category-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 5px;
}

.category-name {
  font-weight: bold;
}

.category-value {
  font-weight: bold;
}

.category-progress {
  height: 9px;
  background: #eee;
  border-radius: 10px;
  overflow: hidden;
}

.category-progress-fill {
  height: 100%;
  border-radius: 10px;
}

/* HISTORY */

.history-item {
  padding: 14px 0;
  border-bottom: 1px solid #eee;
}

.history-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.history-category {
  font-weight: bold;
}

.history-amount {
  color: #dc2626;
  font-weight: bold;
}

.history-details {
  color: #777;
  font-size: 13px;
  margin-top: 5px;
}

.delete-button {
  width: auto;
  padding: 6px 10px;
  margin-top: 8px;
  background: #fee2e2;
  color: #dc2626;
  font-size: 12px;
}

.clear-button {
  background: #dc2626;
  margin-bottom: 30px;
}

.empty {
  text-align: center;
  padding: 20px;
  color: #888;
}

/* MOBILE */

@media(max-width:600px) {

  .summary-cards {
    grid-template-columns: 1fr;
  }

  .summary-card strong {
    font-size: 21px;
  }

  .legend {
    grid-template-columns: 1fr;
  }

  .bar-segment {
    font-size: 9px;
  }
}
</style>
</head>

<body>

<header>

  <h1>💰 My Monthly Expenses</h1>

  <p id="monthTitle"></p>

</header>


<div class="container">


<!-- MONTH -->

<div class="box">

  <h2>📅 Select Month</h2>

  <input
    type="month"
    id="monthPicker"
  >

</div>


<!-- SUMMARY -->

<div class="summary-cards">

  <div class="summary-card">

    <small>Monthly Income</small>

    <strong
      class="income"
      id="incomeDisplay">
      ₹0
    </strong>

  </div>


  <div class="summary-card">

    <small>Total Expenses</small>

    <strong
      class="expense"
      id="expenseDisplay">
      ₹0
    </strong>

  </div>


  <div class="summary-card">

    <small>Balance</small>

    <strong
      class="balance"
      id="balanceDisplay">
      ₹0
    </strong>

  </div>

</div>


<!-- INCOME -->

<div class="box">

  <h2>💰 Monthly Income</h2>

  <label>Income for this month</label>

  <input
    type="number"
    id="incomeInput"
    placeholder="Example: 50000"
    min="0"
  >

  <button onclick="saveIncome()">
    Save Income
  </button>

</div>


<!-- ADD EXPENSE -->

<div class="box">

  <h2>➕ Add Expense</h2>

  <label>Date</label>

  <input
    type="date"
    id="expenseDate"
  >


  <label>Category</label>

  <select id="category">

    <option value="Grocery">
      🛒 Grocery
    </option>

    <option value="Vegetable">
      🥬 Vegetable
    </option>

    <option value="Fruits">
      🍎 Fruits
    </option>

    <option value="Milk">
      🥛 Milk
    </option>

    <option value="Non-Veg">
      🍗 Non-Veg
    </option>

    <option value="Snacks">
      🍪 Snacks
    </option>

    <option value="Cable">
      📺 Cable
    </option>

    <option value="Gas">
      🔥 Gas
    </option>

    <option value="Others">
      📦 Others
    </option>

  </select>


  <label>Amount</label>

  <input
    type="number"
    id="amount"
    placeholder="Enter amount"
    min="1"
  >


  <label>Note</label>

  <input
    type="text"
    id="note"
    placeholder="Example: Rice, milk, fruits..."
  >


  <button onclick="addExpense()">
    💾 Save Expense
  </button>

</div>


<!-- CUMULATIVE CHART -->

<div class="box">

  <h2>📊 Monthly Expense Distribution</h2>

  <p style="color:#777;font-size:13px;">
    Expenses accumulate from left to right. The grey section is your remaining balance.
  </p>


  <div
    class="cumulative-bar"
    id="cumulativeBar">
  </div>


  <div
    class="legend"
    id="chartLegend">
  </div>

</div>


<!-- CATEGORY TOTALS -->

<div class="box">

  <h2>📋 Category-wise Expenses</h2>

  <div id="categorySummary"></div>

</div>


<!-- HISTORY -->

<div class="box">

  <h2>🧾 Expense History</h2>

  <div id="expenseList"></div>

</div>


<!-- CLEAR -->

<button
  class="clear-button"
  onclick="clearAllExpenses()">

  🗑 Delete All Expense Data

</button>


</div>


<script>

/* ==========================================
   DATA
========================================== */

let expenses =
  JSON.parse(
    localStorage.getItem("myExpenses")
  ) || [];


let incomes =
  JSON.parse(
    localStorage.getItem("myIncomes")
  ) || {};


/* ==========================================
   CATEGORIES
========================================== */

const categories = [

  "Grocery",
  "Vegetable",
  "Fruits",
  "Milk",
  "Non-Veg",
  "Snacks",
  "Cable",
  "Gas",
  "Others"

];


/* ==========================================
   COLORS
========================================== */

const colors = {

  "Grocery": "#4f46e5",

  "Vegetable": "#16a34a",

  "Fruits": "#f59e0b",

  "Milk": "#06b6d4",

  "Non-Veg": "#dc2626",

  "Snacks": "#db2777",

  "Cable": "#7c3aed",

  "Gas": "#ea580c",

  "Others": "#64748b"

};


/* ==========================================
   ICONS
========================================== */

const icons = {

  "Grocery": "🛒",

  "Vegetable": "🥬",

  "Fruits": "🍎",

  "Milk": "🥛",

  "Non-Veg": "🍗",

  "Snacks": "🍪",

  "Cable": "📺",

  "Gas": "🔥",

  "Others": "📦"

};


/* ==========================================
   CURRENT DATE
========================================== */

const today =
  new Date();


const todayString =
  today.toISOString()
  .split("T")[0];


document
  .getElementById("expenseDate")
  .value = todayString;


/* ==========================================
   CURRENT MONTH
========================================== */

const currentMonth =
  today.toISOString()
  .slice(0,7);


document
  .getElementById("monthPicker")
  .value = currentMonth;


updateScreen();


/* ==========================================
   SAVE INCOME
========================================== */

function saveIncome() {

  const month =
    document
      .getElementById("monthPicker")
      .value;


  const amount =
    Number(
      document
        .getElementById("incomeInput")
        .value
    );


  if (!month) {

    alert("Please select a month.");

    return;

  }


  if (amount < 0 || isNaN(amount)) {

    alert("Please enter a valid income.");

    return;

  }


  incomes[month] = amount;


  localStorage.setItem(
    "myIncomes",
    JSON.stringify(incomes)
  );


  updateScreen();


  alert("Monthly income saved.");
}


/* ==========================================
   ADD EXPENSE
========================================== */

function addExpense() {

  const date =
    document
      .getElementById("expenseDate")
      .value;


  const category =
    document
      .getElementById("category")
      .value;


  const amount =
    Number(
      document
        .getElementById("amount")
        .value
    );


  const note =
    document
      .getElementById("note")
      .value
      .trim();


  if (!date) {

    alert("Please select a date.");

    return;

  }


  if (!amount || amount <= 0) {

    alert("Please enter a valid amount.");

    return;

  }


  const expense = {

    id: Date.now(),

    date: date,

    category: category,

    amount: amount,

    note: note || "-"

  };


  expenses.push(expense);


  saveData();


  document
    .getElementById("amount")
    .value = "";


  document
    .getElementById("note")
    .value = "";


  updateScreen();

}


/* ==========================================
   SAVE EXPENSE DATA
========================================== */

function saveData() {

  localStorage.setItem(
    "myExpenses",
    JSON.stringify(expenses)
  );

}


/* ==========================================
   UPDATE EVERYTHING
========================================== */

function updateScreen() {

  const month =
    document
      .getElementById("monthPicker")
      .value;


  updateTitle(month);


  const monthExpenses =
    expenses.filter(
      item =>
        item.date.startsWith(month)
    );


  const totalExpenses =
    monthExpenses.reduce(
      (sum,item) =>
        sum + item.amount,
      0
    );


  const income =
    Number(incomes[month] || 0);


  const balance =
    income - totalExpenses;


  document
    .getElementById("incomeDisplay")
    .innerText =
      formatMoney(income);


  document
    .getElementById("expenseDisplay")
    .innerText =
      formatMoney(totalExpenses);


  document
    .getElementById("balanceDisplay")
    .innerText =
      formatMoney(balance);


  /*
     Make negative balance red
  */

  const balanceElement =
    document
      .getElementById("balanceDisplay");


  if (balance < 0) {

    balanceElement.style.color =
      "#dc2626";

  } else {

    balanceElement.style.color =
      "#4f46e5";

  }


  /*
     Load income into input
  */

  document
    .getElementById("incomeInput")
    .value =
      income || "";


  showCumulativeChart(
    monthExpenses,
    income
  );


  showCategorySummary(
    monthExpenses
  );


  showHistory(
    monthExpenses
  );

}


/* ==========================================
   MONTH TITLE
========================================== */

function updateTitle(month) {

  if (!month) return;


  const date =
    new Date(month + "-01");


  document
    .getElementById("monthTitle")
    .innerText =
      date.toLocaleDateString(
        "en-IN",
        {
          month: "long",
          year: "numeric"
        }
      );

}


/* ==========================================
   CUMULATIVE BAR CHART
========================================== */

function showCumulativeChart(
  monthExpenses,
  income
) {

  const bar =
    document
      .getElementById("cumulativeBar");


  const legend =
    document
      .getElementById("chartLegend");


  /*
     Calculate category totals
  */

  const totals = {};


  categories.forEach(category => {

    totals[category] =
      monthExpenses

        .filter(
          item =>
            item.category === category
        )

        .reduce(
          (sum,item) =>
            sum + item.amount,
          0
        );

  });


  const totalExpense =
    Object.values(totals)
      .reduce(
        (sum,value) =>
          sum + value,
        0
      );


  bar.innerHTML = "";

  legend.innerHTML = "";


  /*
     If there is no income,
     display expenses proportionally
  */

  const chartTotal =
    income > 0
      ? income
      : totalExpense;


  if (chartTotal <= 0) {

    bar.innerHTML =
      `<div
        style="
          width:100%;
          display:flex;
          align-items:center;
          justify-content:center;
          color:#777;
        ">
        No data yet
      </div>`;

    return;

  }


  /*
     Create cumulative segments
  */

  categories.forEach(category => {

    const amount =
      totals[category];


    if (amount <= 0) return;


    let percentage =
      (amount / chartTotal) * 100;


    /*
       Don't allow expenses to visually
       extend beyond the income bar.
    */

    if (percentage > 100) {

      percentage = 100;

    }


    const segment =
      document.createElement("div");


    segment.className =
      "bar-segment";


    segment.style.width =
      percentage + "%";


    segment.style.background =
      colors[category];


    /*
       Show category name only if
       there is enough space
    */

    if (percentage >= 8) {

      segment.innerText =
        icons[category] +
        " " +
        category;

    }


    bar.appendChild(segment);


    /*
       Legend
    */

    const legendItem =
      document.createElement("div");


    legendItem.className =
      "legend-item";


    legendItem.innerHTML = `

      <span
        class="legend-color"
        style="
          background:${colors[category]}
        ">
      </span>

      <span>
        ${icons[category]}
        ${category} —
        ${formatMoney(amount)}
      </span>

    `;


    legend.appendChild(
      legendItem
    );

  });


  /*
     Remaining balance
  */

  if (income > totalExpense) {

    const remaining =
      income - totalExpense;


    const percentage =
      (remaining / income) * 100;


    const remainingSegment =
      document.createElement("div");


    remainingSegment.className =
      "bar-segment remaining";


    remainingSegment.style.width =
      percentage + "%";


    if (percentage >= 12) {

      remainingSegment.innerText =
        "Balance";

    }


    bar.appendChild(
      remainingSegment
    );


    /*
       Balance legend
    */

    const balanceLegend =
      document.createElement("div");


    balanceLegend.className =
      "legend-item";


    balanceLegend.innerHTML = `

      <span
        class="legend-color"
        style="background:#e5e7eb">
      </span>

      <span>
        💰 Balance —
        ${formatMoney(remaining)}
      </span>

    `;


    legend.appendChild(
      balanceLegend
    );

  }

}


/* ==========================================
   CATEGORY SUMMARY
========================================== */

function showCategorySummary(
  monthExpenses
) {

  const container =
    document
      .getElementById("categorySummary");


  const totals = {};


  categories.forEach(category => {

    totals[category] =
      monthExpenses

        .filter(
          item =>
            item.category === category
        )

        .reduce(
          (sum,item) =>
            sum + item.amount,
          0
        );

  });


  const highest =
    Math.max(
      ...Object.values(totals),
      0
    );


  let html = "";


  categories.forEach(category => {

    const amount =
      totals[category];


    let percentage = 0;


    if (highest > 0) {

      percentage =
        (amount / highest) * 100;

    }


    html += `

      <div class="category-row">

        <div class="category-top">

          <span class="category-name">

            ${icons[category]}
            ${category}

          </span>

          <span class="category-value">

            ${formatMoney(amount)}

          </span>

        </div>


        <div
          class="category-progress">

          <div
            class="category-progress-fill"
            style="
              width:${percentage}%;
              background:${colors[category]};
            ">
          </div>

        </div>

      </div>

    `;

  });


  container.innerHTML =
    html;

}


/* ==========================================
   EXPENSE HISTORY
========================================== */

function showHistory(
  monthExpenses
) {

  const list =
    document
      .getElementById("expenseList");


  if (monthExpenses.length === 0) {

    list.innerHTML =
      `<div class="empty">
        No expenses recorded this month.
      </div>`;

    return;

  }


  const sorted =
    [...monthExpenses]
      .sort(
        (a,b) =>
          new Date(b.date) -
          new Date(a.date)
      );


  let html = "";


  sorted.forEach(item => {

    html += `

      <div class="history-item">

        <div class="history-top">

          <span class="history-category">

            ${icons[item.category]}
            ${item.category}

          </span>

          <span class="history-amount">

            - ${formatMoney(item.amount)}

          </span>

        </div>


        <div class="history-details">

          ${formatDate(item.date)}

          ${
            item.note !== "-"
              ? " • " + item.note
              : ""
          }

        </div>


        <button
          class="delete-button"
          onclick="deleteExpense(${item.id})">

          Delete

        </button>

      </div>

    `;

  });


  list.innerHTML =
    html;

}


/* ==========================================
   DELETE EXPENSE
========================================== */

function deleteExpense(id) {

  if (
    !confirm(
      "Delete this expense?"
    )
  ) {

    return;

  }


  expenses =
    expenses.filter(
      item =>
        item.id !== id
    );


  saveData();

  updateScreen();

}


/* ==========================================
   CLEAR ALL
========================================== */

function clearAllExpenses() {

  if (
    !confirm(
      "Delete ALL expense and income data?"
    )
  ) {

    return;

  }


  expenses = [];

  incomes = {};


  localStorage.removeItem(
    "myExpenses"
  );


  localStorage.removeItem(
    "myIncomes"
  );


  updateScreen();

}


/* ==========================================
   MONTH CHANGE
========================================== */

document
  .getElementById("monthPicker")
  .addEventListener(
    "change",
    function() {

      const month =
        this.value;


      /*
         Set expense date to selected month
      */

      if (month) {

        document
          .getElementById("expenseDate")
          .value =
            month + "-01";

      }


      updateScreen();

    }
  );


/* ==========================================
   MONEY
========================================== */

function formatMoney(amount) {

  return new Intl.NumberFormat(
    "en-IN",
    {
      style: "currency",
      currency: "INR",
      maximumFractionDigits: 0
    }
  ).format(amount);

}


/* ==========================================
   DATE
========================================== */

function formatDate(date) {

  return new Date(date)
    .toLocaleDateString(
      "en-IN",
      {
        day: "2-digit",
        month: "short",
        year: "numeric"
      }
    );

}

</script>

</body>
</html>
