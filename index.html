<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Monthly Expenses</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f5f9;
  color: #202124;
}

header {
  background: #4f46e5;
  color: white;
  padding: 22px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

header p {
  margin: 7px 0 0;
  opacity: .9;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

/* MONTH */

.month-box {
  background: white;
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.month-box label {
  font-size: 13px;
  color: #777;
  display: block;
  margin-bottom: 6px;
}

input,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 16px;
  background: white;
}

/* SUMMARY */

.summary {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin-bottom: 15px;
}

.summary-card {
  background: white;
  border-radius: 15px;
  padding: 15px 7px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.summary-card small {
  display: block;
  color: #777;
  font-size: 12px;
}
