        
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5145cd">
<title>My Monthly Expenses</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding-bottom: 100px;
  background: #f4f5fb;
  color: #25263b;
  font-family: Arial, sans-serif;
}

header {
  background: linear-gradient(135deg, #5145cd, #8170ed);
  color: white;
  text-align: center;
  padding: 27px 15px 48px;
}

header h1 { margin: 0; font-size: 24px; }
header p { margin: 8px 0 0; opacity: .9; }

.container {
  max-width: 650px;
  margin: -25px auto 0;
  padding: 0 14px;
  position: relative;
}

.card {
  background: white;
  border-radius: 17px;
  padding: 19px;
  margin-bottom: 15px;
  box-shadow: 0 4px 17px rgba(40,35,100,.07);
}

.card h2 { margin: 0 0 17px; font-size: 19px; }

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  color: #606175;
  margin-bottom: 8px;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #dddfea;
  border-radius: 10px;
  background: white;
  font-size: 16px;
  color: #25263b;
}

input:focus, select:focus {
  outline: 2px solid #a6a0f2;
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 9px;
  margin-bottom: 15px;
}

.summary-card {
  background: white;
  padding: 17px 6px;
  text-align: center;
  border-radius: 14px;
  box-shadow: 0 4px 17px rgba(40,35,100,.07);
}

.summary-card small {
  display: block;
  color: #858697;
  font-size: 12px;
  margin-bottom: 9px;
}

.summary-card strong {
  display: block;
  font-size: clamp(13px, 3.6vw, 21px);
  overflow-wrap: anywhere;
}

.green { color: #149b5b; }
.red { color: #e04b56; }
.purple { color: #5145cd; }

.income-form { display: flex; gap: 9px; }
.income-form input { min-width: 0; flex: 1; }

button { cursor: pointer; font-family: inherit; }

.save-income {
  background: #149b5b;
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 0 20px;
  font-weight: bold;
}

/* CIRCULAR CHART */

.chart-area {
  display: flex;
  justify-content: center;
  padding: 12px 0 22px;
}

.donut {
  width: min(68vw, 250px);
  height: min(68vw, 250px);
  border-radius: 50%;
  background: #e8e9f1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.donut-center {
  width: 61%;
  height: 61%;
  border-radius: 50%;
  background: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 7px;
}

.donut-center small {
  font-size: 12px;
  color: #858697;
  margin-bottom: 8px;
}

.donut-center strong {
  font-size: clamp(18px, 5vw, 26px);
  overflow-wrap: anywhere;
}

.chart-help {
  text-align: center;
  color: #858697;
  font-size: 12px;
  margin: 0 0 15px;
}

/* CATEGORY LIST */

.category-row {
  width: 100%;
  background: white;
  border: 0;
  border-bottom: 1px solid #eff0f5;
  padding: 13px 3px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: left;
}

.category-row:last-child { border-bottom: 0; }
.category-row:active { background: #f4f3ff; }

.category-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.color-dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  flex-shrink: 0;
}

.category-name {
  font-size: 14px;
  font-weight: bold;
}

.category-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.category-amount {
  text-align: right;
  font-size: 14px;
  font-weight: bold;
}

.category-percent {
  display: block;
  margin-top: 5px;
  font-size: 12px;
  font-weight: normal;
  color: #858697;
}

.arrow { color: #aaa; font-size: 22px; }

/* FLOATING BUTTON */

.add-button {
  position: fixed;
  bottom: 22px;
  right: 20px;
  z-index: 20;
  background: #5145cd;
  color: white;
  border: 0;
  border-radius: 35px;
  padding: 17px 21px;
  font-size: 15px;
  font-weight: bold;
  box-shadow: 0 6px 20px rgba(81,69,205,.35);
}

/* POPUPS */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(22,20,47,.55);
  padding: 12px;
  overflow-y: auto;
}

.modal.open {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.modal-content {
  background: white;
  border-radius: 19px;
  padding: 20px;
  width: 100%;
  max-width: 520px;
  margin: auto 0;
  max-height: calc(100dvh - 24px);
  overflow-y: auto;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid #eeeef4;
  padding-bottom: 15px;
  margin-bottom: 17px;
}

.modal-header h2 { font-size: 19px; margin: 0; }

.close-button {
  border: 0;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  background: #f1f1f6;
  font-size: 24px;
  flex-shrink: 0;
}

.form-group { margin-bottom: 16px; }

.primary-button {
  background: #5145cd;
  color: white;
  border: 0;
  border-radius: 11px;
  width: 100%;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
}

.detail-item {
  padding: 15px 0;
  border-bottom: 1px solid #f0f0f5;
}

.detail-main {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.detail-description {
  font-weight: bold;
  overflow-wrap: anywhere;
}

.detail-date {
  color: #858697;
  font-size: 12px;
  margin-top: 7px;
}

.detail-amount {
  color: #e04b56;
  font-weight: bold;
  white-space: nowrap;
}

.delete-button {
  background: #fff0f1;
  color: #d73546;
  border: 0;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12px;
  margin-top: 10px;
}

.details-total {
  display: flex;
  justify-content: space-between;
  padding: 18px 0 4px;
  font-size: 18px;
  font-weight: bold;
}

.empty {
  text-align: center;
  color: #858697;
  padding: 25px 5px;
  line-height: 1.6;
}

@media (max-width: 380px) {
  .summary-card strong { font-size: 13px; }
  .category-name, .category-amount { font-size: 13px; }
}
</style>
</head>

<body>

<header>
  <h1>💰 My Monthly Expenses</h1>
  <p id="monthTitle"></p>
</header>

<main class="container">

  <!-- MONTH -->

  <section class="card">
    <label for="monthPicker">Select Month</label>
    <input type="month" id="monthPicker">
  </section>

  <!-- SUMMARY -->

  <section class="summary">

    <div class="summary-card">
      <small>Income</small>
      <strong class="green" id="incomeDisplay">₹0</strong>
    </div>

    <div class="summary-card">
      <small>Expenses</small>
      <strong class="red" id="expenseDisplay">₹0</strong>
    </div>

    <div class="summary-card">
      <small>Balance</small>
      <strong class="purple" id="balanceDisplay">₹0</strong>
    </div>

  </section>

  <!-- INCOME -->

  <section class="card">
    <h2>💵 Monthly Income</h2>
    <label for="incomeInput">Enter or update income</label>

    <div class="income-form">
      <input
        type="number"
        id="incomeInput"
        min="0"
        step="0.01"
        placeholder="e.g. 50000"
      >
      <button class="save-income" id="saveIncomeButton">
        Save
      </button>
    </div>
  </section>

  <!-- CIRCULAR GRAPH -->

  <section class="card">

    <h2>📊 Expense Overview</h2>

    <div class="chart-area">
      <div
        class="donut"
        id="donutChart"
        role="img"
        aria-label="Monthly expense distribution"
      >
        <div class="donut-center">
          <small>Total Expenses</small>
          <strong id="donutTotal">₹0</strong>
        </div>
      </div>
    </div>

    <p class="chart-help">
      Tap a category to view its individual expenses.
    </p>

    <div id="categoryList"></div>

  </section>

</main>

<!-- ADD EXPENSE BUTTON -->

<button class="add-button" id="openAddButton">
  ＋ Add Expense
</button>

<!-- ADD EXPENSE POPUP -->

<div class="modal" id="addModal">
  <div class="modal-content">

    <div class="modal-header">
      <h2>➕ Add Expense</h2>
      <button class="close-button" id="closeAddButton"
        aria-label="Close">×</button>
    </div>

    <form id="expenseForm">

      <div class="form-group">
        <label for="expenseDate">Date</label>
        <input type="date" id="expenseDate" required>
      </div>

      <div class="form-group">
        <label for="category">Category</label>

        <select id="category" required>
          <option value="Grocery">🛒 Grocery</option>
          <option value="Vegetable">🥬 Vegetable</option>
          <option value="Fruits">🍎 Fruits</option>
          <option value="Milk">🥛 Milk</option>
          <option value="Non-Veg">🍗 Non-Veg</option>
          <option value="Snacks">🍪 Snacks</option>
          <option value="Cable">📺 Cable</option>
          <option value="Gas">🔥 Gas</option>
          <option value="Others">📦 Others</option>
        </select>
      </div>

      <div class="form-group">
        <label for="amount">Amount (₹)</label>
        <input
          type="number"
          id="amount"
          min="0.01"
          step="0.01"
          placeholder="Enter amount"
          required
        >
      </div>

      <div class="form-group">
        <label for="note">Description (optional)</label>
        <input
          type="text"
          id="note"
          maxlength="150"
          placeholder="e.g. Rice, Haircut, Medicine"
        >
      </div>

      <button class="primary-button" type="submit">
        Save Expense
      </button>

    </form>

  </div>
</div>

<!-- CATEGORY DETAILS POPUP -->

<div class="modal" id="detailsModal">
  <div class="modal-content">

    <div class="modal-header">
      <h2 id="detailsTitle">Expense Details</h2>
      <button class="close-button" id="closeDetailsButton"
        aria-label="Close">×</button>
    </div>

    <div id="detailsList"></div>

    <div class="details-total">
      <span>Total</span>
      <span id="detailsTotal">₹0</span>
    </div>

  </div>
</div>

<script>
"use strict";

/* ======================================
   CATEGORIES
====================================== */

const categories = [
  "Grocery",
  "Vegetable",
  "Fruits",
  "Milk",
  "Non-Veg",
  "Snacks",
  "Cable",
  "Gas",
  "Others"
];

const icons = {
  Grocery: "🛒",
  Vegetable: "🥬",
  Fruits: "🍎",
  Milk: "🥛",
  "Non-Veg": "🍗",
  Snacks: "🍪",
  Cable: "📺",
  Gas: "🔥",
  Others: "📦"
};

const colors = {
  Grocery: "#5145cd",
  Vegetable: "#22b573",
  Fruits: "#f6ae2d",
  Milk: "#26b6d2",
  "Non-Veg": "#ef5964",
  Snacks: "#ed78b5",
  Cable: "#9b70dd",
  Gas: "#f47b42",
  Others: "#8d99ae"
};

/* ======================================
   LOAD EXISTING DATA
====================================== */

function loadData(key, fallback) {
  try {
    const saved = JSON.parse(localStorage.getItem(key));
    return saved === null ? fallback : saved;
  } catch (error) {
    console.error("Storage error:", error);
    return fallback;
  }
}

let expenses = loadData("myExpenses", []);
let incomes = loadData("myIncomes", {});

if (!Array.isArray(expenses)) {
  expenses = [];
}

if (
  !incomes ||
  typeof incomes !== "object" ||
  Array.isArray(incomes)
) {
  incomes = {};
}

function saveExpenses() {
  localStorage.setItem(
    "myExpenses",
    JSON.stringify(expenses)
  );
}

function saveIncomes() {
  localStorage.setItem(
    "myIncomes",
    JSON.stringify(incomes)
  );
}

/* ======================================
   ELEMENTS
====================================== */

const monthPicker =
  document.getElementById("monthPicker");

const incomeInput =
  document.getElementById("incomeInput");

const expenseDate =
  document.getElementById("expenseDate");

const categoryInput =
  document.getElementById("category");

const amountInput =
  document.getElementById("amount");

const noteInput =
  document.getElementById("note");

const addModal =
  document.getElementById("addModal");

const detailsModal =
  document.getElementById("detailsModal");

let activeCategory = null;

/* ======================================
   LOCAL DATE
====================================== */

function localDateString(date = new Date()) {
  const year = date.getFullYear();

  const month = String(
    date.getMonth() + 1
  ).padStart(2, "0");

  const day = String(
    date.getDate()
  ).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

const today = localDateString();

monthPicker.value = today.slice(0, 7);
expenseDate.value = today;

/* ======================================
   FORMATTING
====================================== */

function money(value) {
  return new Intl.NumberFormat("en-IN", {
    style: "currency",
    currency: "INR",
    maximumFractionDigits: 2
  }).format(Number(value) || 0);
}

function formatDate(dateString) {
  if (!dateString) return "";

  const parts = dateString.split("-");

  if (parts.length !== 3) {
    return dateString;
  }

  const date = new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2])
  );

  return date.toLocaleDateString("en-IN", {
    day: "2-digit",
    month: "short",
    year: "numeric"
  });
}

function monthTitle(month) {
  const parts = month.split("-");

  const date = new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    1
  );

  return date.toLocaleDateString("en-IN", {
    month: "long",
    year: "numeric"
  });
}

/* ======================================
   MONTHLY EXPENSES
====================================== */

function getMonthExpenses() {
  const month = monthPicker.value;

  return expenses.filter(item =>
    typeof item.date === "string" &&
    item.date.startsWith(month)
  );
}

function getCategoryTotals(monthExpenses) {
  const totals = {};

  categories.forEach(category => {
    totals[category] = 0;
  });

  monthExpenses.forEach(item => {
    const category = categories.includes(item.category)
      ? item.category
      : "Others";

    const amount = Number(item.amount);

    if (Number.isFinite(amount) && amount > 0) {
      totals[category] += amount;
    }
  });

  return totals;
}

/* ======================================
   UPDATE DASHBOARD
====================================== */

function updateScreen() {
  const month = monthPicker.value;

  if (!month) return;

  document.getElementById("monthTitle").textContent =
    monthTitle(month);

  const monthExpenses = getMonthExpenses();

  const totals = getCategoryTotals(monthExpenses);

  const totalExpenses = Object.values(totals)
    .reduce((sum, amount) => sum + amount, 0);

  const income = Number(incomes[month]) || 0;

  const balance = income - totalExpenses;

  document.getElementById("incomeDisplay").textContent =
    money(income);

  document.getElementById("expenseDisplay").textContent =
    money(totalExpenses);

  const balanceElement =
    document.getElementById("balanceDisplay");

  balanceElement.textContent = money(balance);

  balanceElement.className =
    balance < 0 ? "red" : "purple";

  incomeInput.value =
    Object.prototype.hasOwnProperty.call(incomes, month)
      ? incomes[month]
      : "";

  showDonutChart(totals, totalExpenses);
  showCategories(totals, totalExpenses);
}

/* ======================================
   CIRCULAR GRAPH
====================================== */

function showDonutChart(totals, totalExpenses) {
  const donut =
    document.getElementById("donutChart");

  document.getElementById("donutTotal").textContent =
    money(totalExpenses);

  if (totalExpenses <= 0) {
    donut.style.background = "#e8e9f1";
    donut.setAttribute(
      "aria-label",
      "No expenses recorded this month"
    );
    return;
  }

  const segments = [];
  let currentAngle = 0;

  const nonZeroCategories = categories.filter(
    category => totals[category] > 0
  );

  nonZeroCategories.forEach((category, index) => {
    const amount = totals[category];

    const angle =
      index === nonZeroCategories.length - 1
        ? 360 - currentAngle
        : (amount / totalExpenses) * 360;

    const nextAngle = currentAngle + angle;

    segments.push(
      `${colors[category]} ${currentAngle}deg ${nextAngle}deg`
    );

    currentAngle = nextAngle;
  });

  donut.style.background =
    `conic-gradient(${segments.join(", ")})`;

  donut.setAttribute(
    "aria-label",
    "Expense distribution: " +
    nonZeroCategories.map(category => {
      const percent =
        (totals[category] / totalExpenses * 100).toFixed(1);

      return `${category} ${percent}%`;
    }).join(", ")
  );
}

/* ======================================
   CATEGORY NAMES AND AMOUNTS
====================================== */

function showCategories(totals, totalExpenses) {
  const container =
    document.getElementById("categoryList");

  container.replaceChildren();

  categories.forEach(category => {
    const amount = totals[category];

    const percentage = totalExpenses > 0
      ? (amount / totalExpenses) * 100
      : 0;

    const row = document.createElement("button");
    row.type = "button";
    row.className = "category-row";

    const left = document.createElement("div");
    left.className = "category-left";

    const dot = document.createElement("span");
    dot.className = "color-dot";
    dot.style.background = colors[category];

    const name = document.createElement("span");
    name.className = "category-name";
    name.textContent = `${icons[category]} ${category}`;

    left.append(dot, name);

    const right = document.createElement("div");
    right.className = "category-right";

    const amountBox = document.createElement("div");
    amountBox.className = "category-amount";
    amountBox.textContent = money(amount);

    const percentText = document.createElement("span");
    percentText.className = "category-percent";
    percentText.textContent =
      `${percentage.toFixed(1)}%`;

    amountBox.appendChild(percentText);

    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "›";

    right.append(amountBox, arrow);
    row.append(left, right);

    row.addEventListener("click", () => {
      openDetails(category);
    });

    container.appendChild(row);
  });
}

/* ======================================
   SAVE MONTHLY INCOME
====================================== */

function saveIncome() {
  const month = monthPicker.value;

  const rawAmount = incomeInput.value.trim();
  const amount = Number(rawAmount);

  if (
    !month ||
    rawAmount === "" ||
    !Number.isFinite(amount) ||
    amount < 0
  ) {
    alert("Please enter a valid monthly income.");
    return;
  }

  incomes[month] = amount;

  try {
    saveIncomes();
    updateScreen();
    alert("Monthly income saved.");
  } catch (error) {
    alert("Unable to save income. Check browser storage.");
  }
}

/* ======================================
   ADD EXPENSE
====================================== */

function openAddExpense() {
  const selectedMonth = monthPicker.value;
  const currentMonth = today.slice(0, 7);

  expenseDate.value =
    selectedMonth === currentMonth
      ? today
      : `${selectedMonth}-01`;

  addModal.classList.add("open");
}

function closeAddExpense() {
  addModal.classList.remove("open");
}

function addExpense(event) {
  event.preventDefault();

  const date = expenseDate.value;
  const category = categoryInput.value;
  const rawAmount = amountInput.value.trim();
  const amount = Number(rawAmount);
  const note = noteInput.value.trim();

  if (!date) {
    alert("Please select a date.");
    return;
  }

  if (!categories.includes(category)) {
    alert("Please select a category.");
    return;
  }

  if (
    rawAmount === "" ||
    !Number.isFinite(amount) ||
    amount <= 0
  ) {
    alert("Please enter a valid expense amount.");
    return;
  }

  const expense = {
    id:
      Date.now().toString() +
      "-" +
      Math.random().toString(36).slice(2),

    date: date,
    category: category,
    amount: amount,
    note: note || "-"
  };

  expenses.push(expense);

  try {
    saveExpenses();
  } catch (error) {
    expenses.pop();
    alert("Unable to save expense. Check browser storage.");
    return;
  }

  // Display the month of the newly added expense.
  monthPicker.value = date.slice(0, 7);

  amountInput.value = "";
  noteInput.value = "";

  closeAddExpense();
  updateScreen();
}

/* ======================================
   CATEGORY DETAILS
====================================== */

function openDetails(category) {
  activeCategory = category;

  const monthExpenses = getMonthExpenses();

  const items = monthExpenses
    .filter(item => {
      const itemCategory =
        categories.includes(item.category)
          ? item.category
          : "Others";

      return itemCategory === category;
    })
    .sort((a, b) =>
      String(b.date).localeCompare(String(a.date))
    );

  document.getElementById("detailsTitle").textContent =
    `${icons[category]} ${category} — ${monthTitle(monthPicker.value)}`;

  const list =
    document.getElementById("detailsList");

  list.replaceChildren();

  let total = 0;

  if (items.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent =
      `No ${category} expenses recorded this month.`;

    list.appendChild(empty);
  }

  items.forEach(item => {
    const amount = Number(item.amount) || 0;
    total += amount;

    const entry = document.createElement("div");
    entry.className = "detail-item";

    const main = document.createElement("div");
    main.className = "detail-main";

    const info = document.createElement("div");

    const description = document.createElement("div");
    description.className = "detail-description";
    description.textContent =
      item.note && item.note !== "-"
        ? item.note
        : category;

    const date = document.createElement("div");
    date.className = "detail-date";
    date.textContent = formatDate(item.date);

    info.append(description, date);

    const amountElement = document.createElement("div");
    amountElement.className = "detail-amount";
    amountElement.textContent = `− ${money(amount)}`;

    main.append(info, amountElement);

    const deleteButton = document.createElement("button");
    deleteButton.className = "delete-button";
    deleteButton.type = "button";
    deleteButton.textContent = "Delete";

    deleteButton.addEventListener("click", () => {
      deleteExpense(item.id);
    });

    entry.append(main, deleteButton);
    list.appendChild(entry);
  });

  document.getElementById("detailsTotal").textContent =
    money(total);

  detailsModal.classList.add("open");
}

function closeDetails() {
  detailsModal.classList.remove("open");
  activeCategory = null;
}

/* ======================================
   DELETE ONE EXPENSE
====================================== */

function deleteExpense(id) {
  if (!confirm("Delete this expense?")) {
    return;
  }

  const originalExpenses = expenses;

  expenses = expenses.filter(item =>
    String(item.id) !== String(id)
  );

  try {
    saveExpenses();
  } catch (error) {
    expenses = originalExpenses;
    alert("Unable to delete expense.");
    return;
  }

  updateScreen();

  if (activeCategory) {
    openDetails(activeCategory);
  }
}

/* ======================================
   BUTTONS AND EVENTS
====================================== */

document.getElementById("saveIncomeButton")
  .addEventListener("click", saveIncome);

document.getElementById("openAddButton")
  .addEventListener("click", openAddExpense);

document.getElementById("closeAddButton")
  .addEventListener("click", closeAddExpense);

document.getElementById("closeDetailsButton")
  .addEventListener("click", closeDetails);

document.getElementById("expenseForm")
  .addEventListener("submit", addExpense);

monthPicker.addEventListener("change", () => {
  closeDetails();
  updateScreen();
});

// Close popup when tapping outside its white box.
addModal.addEventListener("click", event => {
  if (event.target === addModal) {
    closeAddExpense();
  }
});

detailsModal.addEventListener("click", event => {
  if (event.target === detailsModal) {
    closeDetails();
  }
});

// Close popup using Android keyboard Escape or desktop Escape.
document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeAddExpense();
    closeDetails();
  }
});

/* ======================================
   START APP
====================================== */

updateScreen();

</script>

</body>
</html>
